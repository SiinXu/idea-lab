name: Hotspots freshness watchdog
# Hotspots are produced by a Grok Bot agent routine on the shared box ("Idea Lab 热点每 15 分钟更新":
# python3 scripts/hotspots_update.py new.json -> commit + push -> Pages). This workflow does NOT generate
# content (summaries need an LLM); it only alerts when the live data stops moving.
# Alert = this run fails (red) + one open issue labelled "stale-data" (auto-closed when data is fresh again).
on:
  schedule:
    - cron: "41 * * * *"   # hourly
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check hotspots data.js/heat.js/ideas.js lastUpdated (2h/3h/26h)
        id: age
        run: |
          python3 - <<'PY'
          import os, re, urllib.request, datetime as dt
          base = "https://siinxu.github.io/idea-lab/hotspots/"
          # file, threshold hours. data.js: 15-min routine; heat.js: hourly heat build; ideas.js: rebuilt hourly, regenerated by model ~daily.
          checks = [("data.js", 2), ("heat.js", 3), ("ideas.js", 26)]
          now = dt.datetime.now(dt.timezone.utc); lines = []; stale = False
          for name, th in checks:
              try:
                  src = urllib.request.urlopen(base + name + "?v=" + str(now.timestamp()), timeout=30).read().decode()
                  m = re.search(r'"lastUpdated":\s*"([^"]+)"', src)
                  ts = dt.datetime.fromisoformat(m.group(1).replace("Z", "+00:00"))
                  age_h = (now - ts).total_seconds() / 3600; bad = age_h > th
                  lines.append(f"{name} lastUpdated {ts.isoformat()} — age {age_h:.1f} h (threshold {th} h) — {'STALE' if bad else 'ok'}")
              except Exception as e:
                  bad = True; lines.append(f"{name} — cannot read lastUpdated ({e}) — STALE")
              stale = stale or bad
          line = "Idea Lab hotspots: " + " | ".join(lines)
          print(line)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f: f.write("\n".join(lines) + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f: f.write(f"stale={'true' if stale else 'false'}\nline={line}\n")
          PY
      - name: Open or update alert issue
        if: steps.age.outputs.stale == 'true'
        env: { GH_TOKEN: "${{ github.token }}", LINE: "${{ steps.age.outputs.line }}", REPO: "${{ github.repository }}" }
        run: |
          gh label create stale-data -R "$REPO" -c d73a4a -d "Data freshness alert" 2>/dev/null || true
          n=$(gh issue list -R "$REPO" -l stale-data -s open --json number -q '.[0].number')
          body="$LINE
          Run: ${{ github.server_url }}/$REPO/actions/runs/${{ github.run_id }}
          Producers: Grok Bot routines on the shared box (scripts/hotspots_update.py for data.js; scripts/heat_hourly.sh + ideas_gen.py build for heat.js/ideas.js). Check that the routine is still active."
          if [ -n "$n" ]; then gh issue comment "$n" -R "$REPO" -b "$body"; else gh issue create -R "$REPO" -l stale-data -t "Hotspots data stale" -b "$body"; fi
          exit 1
      - name: Close alert issue when fresh
        if: steps.age.outputs.stale == 'false'
        env: { GH_TOKEN: "${{ github.token }}", REPO: "${{ github.repository }}" }
        run: |
          for n in $(gh issue list -R "$REPO" -l stale-data -s open --json number -q '.[].number'); do gh issue close "$n" -R "$REPO" -c "Fresh again: ${{ steps.age.outputs.line }}"; done
